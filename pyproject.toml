[project]
name = "gamehackbench"
version = "0.1.0"
description = "Benchmark for agents that patch old console binaries to enable cheats, verified via emulator memory state."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.0",
    "inspect-ai>=0.3.217",
    "openai>=2.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pre-commit>=4.2.0",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
    "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
